sentence=The Arduino way of talking to hardware, on a GEM machine.
paragraph=Time, pins, a second serial port, and a client for a radio module that speaks AT commands. A GEM program keeps its own main() and its own event loop; this is what it reaches for when it wants to touch the world outside the screen. delay() gives the processor away instead of burning it, so the desktop and the other programs keep running.
