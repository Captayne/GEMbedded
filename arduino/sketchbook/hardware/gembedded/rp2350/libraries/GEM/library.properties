sentence=The AES and the VDI of GEM, and tasks on the real-time core.
paragraph=A sketch for this board is an ordinary GEM program: it has its own main(), it announces itself with appl_init() and it waits for events in its own evnt_multi() loop. Every AES and VDI call is available, and irk.h starts cyclic tasks on the other core, which keep time while GEM draws. The examples show a window, and a clock whose second half runs on that other core.
